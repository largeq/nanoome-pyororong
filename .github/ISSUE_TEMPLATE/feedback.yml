name: 피드백 및 지원 요청
description: 문제 신고, 개선 제안, 사용 문의를 남겨 주세요.
body:
  - type: markdown
    attributes:
      value: |
        GitHub 계정으로 작성하는 공개 문의입니다. 내용과 첨부파일은 누구나 볼 수 있습니다.
        비밀번호·인증번호·개인정보가 포함된 문서는 올리지 마세요. 화면 사진을 첨부할 때는 이름·이메일 등 개인정보를 가려 주세요.
  - type: dropdown
    id: request-type
    attributes:
      label: 문의 종류
      options:
        - 문제 신고
        - 개선 제안
        - 사용 문의
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 문의 내용
      description: 궁금한 점이나 개선했으면 하는 점을 적어 주세요. 문제 신고라면 당시 어떤 작업 중이었는지도 아는 만큼 알려 주세요. 필요한 화면 사진은 여기에 첨부할 수 있습니다.
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: 표로롱 버전
      description: 앱에서 이 양식을 열면 자동으로 입력됩니다.
  - type: input
    id: macos-version
    attributes:
      label: macOS 버전
      description: 앱에서 이 양식을 열면 자동으로 입력됩니다.
